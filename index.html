<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Loading Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: white; text-transform: uppercase;
        }
        .bg-slide {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: opacity 2s ease-in-out;
            opacity: 0;
        }
        .bg-slide.active { opacity: 0.4; }
        .gradient-overlay {
            position: absolute; inset-y: 0; left: 0; width: 600px;
            background: linear-gradient(to right, rgba(0,0,0,1), rgba(0,0,0,0.4), transparent);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="slideshow"></div>
    <div class="gradient-overlay"></div>

    <div class="relative z-20 flex flex-col justify-end h-full p-20 gap-8">
        <div>
            <h1 class="text-7xl font-black italic tracking-tighter leading-none m-0">СТРОЙ / УБИВАЙ</h1>
            <div class="flex items-center gap-3 opacity-30 mt-4">
                <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                <span class="text-[10px] tracking-[0.5em] font-bold">ПОДКЛЮЧЕНИЕ К СЕРВЕРУ</span>
            </div>
        </div>

        <div class="flex gap-16 border-l-2 border-white/10 pl-10">
            <div class="flex flex-col">
                <span class="text-[10px] tracking-widest text-white/30 font-black mb-1">ИГРОКИ</span>
                <span id="players" class="text-3xl font-light">0 / 0</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] tracking-widest text-white/30 font-black mb-1">КАРТА</span>
                <span id="map" class="text-3xl font-light tracking-tight">ЗАГРУЗКА...</span>
            </div>
        </div>
    </div>

    <script>

        let images = [
            'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1600',
            'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600'
        ];
        let currentIndex = 0;

        async function loadDropbox() {
            try {
                const r = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${DROPBOX_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: '/Photos' })
                });
                const d = await r.json();
                if (d.entries) {
                    const files = d.entries.filter(f => f['.tag'] === 'file').slice(0, 5);
                    const urls = [];
                    for (const f of files) {
                        const lr = await fetch('https://api.dropboxapi.com/2/files/get_temporary_link', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${DROPBOX_TOKEN}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: f.path_lower })
                        });
                        const ld = await lr.json();
                        if (ld.link) urls.push(ld.link);
                    }
                    if (urls.length > 0) {
                        images = urls;
                        renderSlides();
                    }
                }
            } catch(e) { console.log('Using default images'); renderSlides(); }
        }

        async function updateServer() {
            try {
                const r = await fetch('https://api.gamemonitoring.ru/servers/11327074');
                const d = await r.json();
                if (d.response) {
                    document.getElementById('players').innerText = `${d.response.numplayers} / ${d.response.maxplayers}`;
                    document.getElementById('map').innerText = d.response.map;
                }
            } catch(e) {}
        }

        function renderSlides() {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';
            images.forEach((src, i) => {
                const div = document.createElement('div');
                div.className = 'bg-slide' + (i === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${src}')`;
                container.appendChild(div);
            });
        }

        function startSlideshow() {
            setInterval(() => {
                const slides = document.querySelectorAll('.bg-slide');
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }, 6000);
        }

        loadDropbox();
        updateServer();
        setInterval(updateServer, 20000);
        startSlideshow();
    </script>
</body>
</html>
