<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка</title>

<link rel="preload" href="fonts/Benzin-Bold.ttf" as="font" type="font/ttf" crossorigin>

<style>

@font-face{
font-family:"Benzin";
src:url("fonts/Benzin-Regular.ttf") format("truetype");
font-weight:400;
font-display:swap;
}

@font-face{
font-family:"Benzin";
src:url("fonts/Benzin-Medium.ttf") format("truetype");
font-weight:500;
font-display:swap;
}

@font-face{
font-family:"Benzin";
src:url("fonts/Benzin-Semibold.ttf") format("truetype");
font-weight:600;
font-display:swap;
}

@font-face{
font-family:"Benzin";
src:url("fonts/Benzin-Bold.ttf") format("truetype");
font-weight:700;
font-display:swap;
}

@font-face{
font-family:"Benzin";
src:url("fonts/Benzin-ExtraBold.ttf") format("truetype");
font-weight:800;
font-display:swap;
}
/* === BASE === */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:"Benzin", sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* === CENTER === */
.center{
text-align:center;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1s ease forwards;
}

.title{
font-weight:800;
font-size:64px;
letter-spacing:3px;
}

.status{
margin-top:12px;
font-size:13px;
opacity:.4;
letter-spacing:2px;
font-weight:500;
}

/* === BAR === */
.bar{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:120px;
height:2px;
background:#111;
overflow:hidden;
opacity:0;
animation:fadeIn 1s ease forwards .5s;
}

.bar::after{
content:"";
position:absolute;
width:40px;
height:100%;
background:#fff;
animation:load 1.2s linear infinite;
}

/* === TIPS (мемы) === */
.tips{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
font-size:14px;
opacity:0;
letter-spacing:1px;
transition:opacity .5s ease, transform .5s ease;
}

.tips.show{
opacity:.35;
transform:translateX(-50%) translateY(0);
}

/* === ANIMATIONS === */
@keyframes load{
0%{left:-40px}
100%{left:100%}
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeIn{
to{opacity:1;}
}

</style>
</head>

<body>

<div class="center">
<div class="title">СТРОЙ I УБИВАЙ</div>
<div class="status">загрузка</div>
</div>

<div class="tips" id="tip"></div>
<div class="bar"></div>

<script>
const tips = [
"Ты видишь мой скин?",
"Физ будет снят",
"Лсд симулятор прихода не будет",
"Большой папик смотрит",
"Где пандус?",
"Анша абдуль",
"Надо ссать на клетку забаненых и все в жизни будет хорошо",
"Лоадинг супер кодер...",
"Эксплуатация харкев запрещена"
];

function shuffle(arr){
return arr.sort(() => Math.random() - 0.5);
}

let shuffled = shuffle([...tips]);
let index = 0;

const tipEl = document.getElementById("tip");

function showTip(){
tipEl.classList.remove("show");

setTimeout(() => {
tipEl.textContent = shuffled[index];
tipEl.classList.add("show");

index++;

if(index >= shuffled.length){
shuffled = shuffle([...tips]);
index = 0;
}

}, 400); // задержка перед появлением
}

/* старт */
showTip();
setInterval(showTip, 5500); // МЕДЛЕННЕЕ
</script>

</body>
</html>
