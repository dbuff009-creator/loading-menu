<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка</title>

<!-- preload -->
<link rel="preload" href="font/Benzin-Medium.ttf" as="font" type="font/ttf" crossorigin>

<style>

/* === FONT (ОДИН ФАЙЛ) === */
@font-face{
font-family:"Benzin";
src:url("font/Benzin-Medium.ttf") format("truetype");
font-weight:normal;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:"BenzinB";
src:url("font/Benzin-Bold.ttf") format("truetype");
font-weight:normal;
font-style:normal;
font-display:swap;
}

@font-face{
font-family:"BenzinL";
src:url("font/Benzin-Regular.ttf") format("truetype");
font-weight:normal;
font-style:normal;
font-display:swap;
}


/* === BASE === */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:"Benzin", Arial, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* === CENTER === */
.center{
text-align:center;
opacity:0;
transform:translateY(20px);
animation:fadeUp 1s ease forwards;
}

/* === TITLE === */
.title{
font-family:"BenzinB", sans-serif;
font-size:64px;
letter-spacing:3px;
}

/* === STATUS === */
.status{
margin-top:12px;
font-size:13px;
opacity:.4;
letter-spacing:2px;
}

/* === TIPS === */
.tips{
position:fixed;
font-family:"BenzinL", sans-serif;
bottom:80px;
left:50%;
transform:translateX(-50%) translateY(10px);
font-size:14px;
letter-spacing:1px;
opacity:0;
filter:blur(6px);
transition:
opacity .8s ease,
transform .8s ease,
filter .8s ease;
}

.tips.show{
opacity:.35;
transform:translateX(-50%) translateY(0);
filter:blur(0);
}

/* === BAR === */
.bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:120px;
height:2px;
background:#111;
overflow:hidden;
opacity:0;
animation:fadeIn 1s ease forwards .5s;
}

.bar::after{
content:"";
position:absolute;
width:40px;
height:100%;
background:#fff;
animation:load 1.2s linear infinite;
}

/* === ANIMATIONS === */
@keyframes load{
0%{left:-40px}
100%{left:100%}
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeIn{
to{opacity:1;}
}

</style>
</head>

<body>

<div class="center">
<div class="title">СТРОЙ I УБИВАЙ</div>
<div class="status">загрузка</div>
</div>

<div class="tips" id="tip"></div>
<div class="bar"></div>

<script>

/* === МЕМЫ === */
const tips = [
"Ты видишь мой скин?",
"Физ будет снят",
"Лсд симулятор прихода не будет",
"Большой папик смотрит",
"Где пандус?",
"Анша абдуль",
"Надо ссать на клетку забаненых и все в жизни будет хорошо",
"Лоадинг супер кодер...",
"Эксплуатация харкев запрещена"
];

function shuffle(arr){
return arr.sort(() => Math.random() - 0.5);
}

let shuffled = shuffle([...tips]);
let index = 0;

const tipEl = document.getElementById("tip");

function showTip(){
tipEl.classList.remove("show");

setTimeout(() => {
tipEl.textContent = shuffled[index];
tipEl.classList.add("show");

index++;

if(index >= shuffled.length){
shuffled = shuffle([...tips]);
index = 0;
}

}, 400);
}

showTip();
setInterval(showTip, 5500);

</script>

</body>
</html>
