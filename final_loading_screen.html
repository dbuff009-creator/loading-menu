<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Loading Screen</title>
    <!-- Подключаем Tailwind для дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; text-transform: uppercase;
        }
        .bg-slide {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: opacity 2s ease-in-out, transform 10s linear;
            opacity: 0; transform: scale(1.1);
        }
        .bg-slide.active { opacity: 0.4; transform: scale(1); }
        .noise {
            position: absolute; inset: 0; z-index: 30; pointer-events: none;
            opacity: 0.03; background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        }
        .gradient-overlay {
            position: absolute; inset-y: 0; left: 0; width: 600px;
            background: linear-gradient(to right, rgba(0,0,0,1), rgba(0,0,0,0.5), transparent);
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Слайдшоу -->
    <div id="slideshow-container"></div>
    
    <!-- Градиент -->
    <div class="gradient-overlay"></div>
    <div class="noise"></div>

    <!-- Контент -->
    <div class="relative z-20 flex flex-col justify-end h-full p-20 gap-10">
        <div>
            <h1 id="server-name" class="text-7xl font-black italic tracking-tighter leading-none m-0">
                СТРОЙ / УБИВАЙ
            </h1>
            <div class="flex items-center gap-3 opacity-30 mt-4">
                <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                <span class="text-[10px] tracking-[0.5em] font-bold">ПОДКЛЮЧЕНИЕ...</span>
            </div>
        </div>

        <div class="flex gap-16 border-l-2 border-white/10 pl-10">
            <div class="flex flex-col">
                <span class="text-[10px] tracking-widest text-white/30 font-black mb-1">ИГРОКИ</span>
                <span id="player-count" class="text-3xl font-light">0 <span class="opacity-10">/ 128</span></span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] tracking-widest text-white/30 font-black mb-1">КАРТА</span>
                <span id="map-name" class="text-3xl font-light tracking-tight">ЗАГРУЗКА...</span>
            </div>
        </div>
    </div>
